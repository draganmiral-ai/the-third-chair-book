services:
  - type: web
    name: the-third-chair-book
    runtime: static
    buildCommand: echo "Static website ready"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
